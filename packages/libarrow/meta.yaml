# Inspired by https://github.com/emscripten-forge/recipes/blob/main/recipes/recipes_emscripten/arrow/recipe.yaml

package:
  name: libarrow
  version: 12.0.0

source:
  url: https://github.com/apache/arrow/archive/refs/tags/apache-arrow-12.0.0.dev.tar.gz
  sha256: 17b36fa28c926ae2da2b5f0cf16faf2f3acbf5403e11231b1f1c023528f3b87d

build:
  type: shared_library
  script: |
    cd cpp
    mkdir build
    cd build

    cmake  .. \
      -DCMAKE_CXX_FLAGS="-fPIC" \
      -DCMAKE_INSTALL_PREFIX=${WASM_LIBRARY_DIR} \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_BUILD_TYPE=Release \
      -DARROW_SIMD_LEVEL=NONE \
      -DARROW_RUNTIME_SIMD_LEVEL=NONE \
      -DARROW_BUILD_TESTS=OFF \
      -DARROW_ENABLE_TIMING_TESTS=OFF \
      -DARROW_BUILD_SHARED=ON \
      -DARROW_COMPUTE=ON \
      -DARROW_CSV=ON \
      -DARROW_JSON=OFF \
      -DARROW_JEMALLOC=OFF \
      -DARROW_FILESYSTEM=ON \
      -DARROW_DATASET=ON \
      -DARROW_WITH_UTF8PROC=OFF \
      -DARROW_WITH_RE2=OFF \
      #-Dutf8proc_LIB=${PREFIX}/lib/libutf8proc.a \
      #-Dutf8proc_INCLUDE_DIR=${PREFIX}/include \
      #-DRapidJSON_DIR=${PREFIX}/lib/cmake/RapidJSON/ \

    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
    cp ${WASM_LIBRARY_DIR}/lib/libarrow.so ${DISTDIR}
    cp ${WASM_LIBRARY_DIR}/lib/libarrow_dataset.so ${DISTDIR}
